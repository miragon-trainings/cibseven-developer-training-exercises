name: Build

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build with Maven
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Lint BPMN (bpmnlint)
        run: |
          npm ci
          npm run lint:bpmn

      - name: Build
        run: ./mvnw clean verify

      # The Aufgabe-10 worker template lives under templates/ and is not part of the default reactor
      # (so services/ stays clean for exercises 0–9). Compile it here so the starter never rots. Its pom
      # targets its final home (services/logistics-service), so we install the root pom first to resolve
      # the parent from the repo while it still sits under templates/.
      - name: Verify exercise-10 starter template
        run: |
          ./mvnw -N -q install
          ./mvnw -Pexercise-10 -pl templates/exercise-10/logistics-service clean compile
