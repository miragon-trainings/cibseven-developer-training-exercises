name: Build

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build with Maven
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # load-solution resets services/process-application to templates/process-application-starter/,
      # so the template must stay a byte copy of the module's starter state (src/ + pom.xml).
      # The task itself is not run in CI; check it locally before changing it, the starter or a solution:
      #   bash .github/scripts/check-load-solution.sh load NN | sequence A B ...
      - name: Check starter baseline
        run: bash .github/scripts/check-load-solution.sh baseline

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Lint BPMN (bpmnlint)
        run: |
          npm ci
          npm run lint:bpmn

      - name: Build
        run: ./mvnw clean verify

      # The Aufgabe-7 worker template lives under templates/ and is not part of the default reactor
      # (so services/ stays clean for exercises 0–6). Compile it here so the starter never rots. Its pom
      # targets its final home (services/logistics-service), so we install the root pom first to resolve
      # the parent from the repo while it still sits under templates/.
      - name: Verify exercise-07 starter template
        run: |
          ./mvnw -N -q install
          ./mvnw -Pexercise-07 -pl templates/exercise-07/logistics-service clean compile
