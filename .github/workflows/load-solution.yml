name: Load solution

# Exercises the catch-up task of the work module (antrun "load-solution", see
# services/process-application/pom.xml) through .github/scripts/check-load-solution.sh. Every leg works
# on a copy of the fresh checkout, so the legs never see each other's state.
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'services/process-application/**'
      - 'templates/process-application-starter/**'
      - 'solutions/**'
      - 'pom.xml'
      - '.mvn/**'
      - 'mvnw'
      - 'mvnw.cmd'
      - '.gitattributes'
      - '.github/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  load:
    # Fresh checkout -> load-solution NN -> file tree + pom check -> ./mvnw verify -> smoke start
    name: Load ${{ matrix.solution }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        solution: [ '00', '01', '02', '03', '04', '05', '06', '07', '08', '09', '10' ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Load solution ${{ matrix.solution }}
        run: bash .github/scripts/check-load-solution.sh load ${{ matrix.solution }}

  sequences:
    # Loads one solution after another (building and editing in between); the result must equal a
    # fresh load of the last one: forward with a dropped file set (04 05), backward jumps (10 03, 07 05)
    # and the same solution twice (03 03).
    name: Sequence ${{ matrix.sequence }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        sequence: [ '04 05', '10 03', '07 05', '03 03' ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Load ${{ matrix.sequence }}
        run: bash .github/scripts/check-load-solution.sh sequence ${{ matrix.sequence }}

  windows:
    # The task must work without a shell, on a CRLF checkout and through mvnw.cmd (the script picks
    # mvnw.cmd under Git Bash). One backward jump is enough to cover the Ant regexes and paths.
    name: Sequence 10 03 (Windows, CRLF)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      # Git for Windows' default, made explicit: participants on Windows get CRLF files.
      - name: Check out with CRLF line endings
        run: git config --global core.autocrlf true

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Load 10, then 03
        run: |
          if [ "$(tr -cd '\r' < templates/process-application-starter/pom.xml | wc -c)" -eq 0 ]; then
            echo "::error::expected a CRLF checkout (core.autocrlf=true)"; exit 1
          fi
          bash .github/scripts/check-load-solution.sh sequence 10 03 --no-smoke
