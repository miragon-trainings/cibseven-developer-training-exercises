server:
  port: 8080

# H2 in-memory: no external database needed. Start the example with `../../mvnw spring-boot:run`
# and everything (engine tables + this app) lives in memory for the lifetime of the process.
spring:
  datasource:
    url: jdbc:h2:mem:compensate-and-retry;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

camunda:
  bpm:
    admin-user:
      id: admin
      password: admin
    database:
      type: h2
      schema-update: true

