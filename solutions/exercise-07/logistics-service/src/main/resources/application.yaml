# Logistics service — the remote OWNER of the sendWelcomeKit process. It runs no engine of its own;
# it knows the shared engine only through its REST API. A lightweight HTTP server (the "re-send" action)
# runs on :8090 so it does not clash with the engine host on :8080.
server:
  port: 8090

spring:
  application:
    name: logistics-service

# CIB seven community REST client: the typed /engine-rest client (ProcessDefinitionApi & co.) talks to
# the shared engine. At start-up the starter also deploys our own BPMN (src/main/resources/bpmn) there —
# so the engine has to be running before this service starts.
cibseven:
  bpm:
    client:
      base-url: http://localhost:8080/engine-rest
  auto-deploy:
    bpmn-resources: classpath*:bpmn/*.bpmn

# CIB Seven External Task Client: connect remotely to the same engine and fulfil our topic.
camunda:
  bpm:
    client:
      base-url: ${cibseven.bpm.client.base-url}
      lock-duration: 20000

logging:
  level:
    io.miragon.training: INFO
